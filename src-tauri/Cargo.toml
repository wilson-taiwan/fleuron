[package]
name = "qualitative-coding-app"
version = "2.7.0"
description = "Offline qualitative coding for reflexive thematic analysis"
authors = ["Fleuron contributors"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qualitative_coding_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Fleuron"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api backs the translucent window + vibrancy declared in
# tauri.conf.json. It rules out Mac App Store submission; Fleuron ships as a
# DMG, so that costs nothing.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.23.3", features = ["v4", "serde"] }
tauri-plugin-dialog = "2.7.1"
# Handoff bundles. deflate-only via flate2, which the tree already carries —
# the default feature set drags in half a dozen codecs nothing here uses.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Sync talks to Supabase over PostgREST, which is plain HTTP + JSON — no SDK.
# rustls rather than native-tls so the Windows build does not depend on a system
# OpenSSL, and default-features off to keep the cookie/proxy/blocking stack out.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "charset",
  "http2",
] }
sha2 = "0.10"
trash = "5"
tauri-plugin-updater = "=2.10.1"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "net"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tempfile = "3"
fs2 = "0.4"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_Security_Cryptography",
  "Win32_System_Memory",
] }

[dev-dependencies]
httpmock = "0.7"
tauri = { version = "2", features = ["test"] }
regex = "1"

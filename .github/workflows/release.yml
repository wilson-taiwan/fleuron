name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      # Fail closed: prove the ref is a version tag matching the manifest.
      - name: Refuse non-tag refs
        run: |
          test "${{ github.ref }}" = "refs/tags/${{ github.ref_name }}" \
            && echo "ref is a tag: ${{ github.ref_name }}"
      - name: Tag matches app version
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          APP_VERSION="$(node -p "require('./package.json').version")"
          test "$TAG_VERSION" = "v$APP_VERSION" \
            || { echo "Tag $TAG_VERSION does not match app version v$APP_VERSION"; exit 1; }

      - name: Validate workflow YAML syntax
        run: |
          ruby -e 'require "yaml"; %w[.github/workflows/test.yml .github/workflows/test-e2e.yml .github/workflows/candidate.yml .github/workflows/release.yml].each { |f| YAML.load_file(f) }'

      - name: Release-contract assertions (+ negative mutations)
        run: node --test scripts/release-contract.test.mjs

      - name: macOS QA runner syntax
        run: |
          bash -n qa/macos/Invoke-FleuronQA.sh
          bash qa/macos/Invoke-FleuronQA.sh --help

      - name: Pre-tag smoke state
        run: node scripts/verify-release-smoke.mjs --pre-tag RELEASE-SMOKE.md

      - name: Static migration gate
        run: bash scripts/verify-supabase-migrations.sh

      - name: Migration verifier self-check
        run: bash scripts/verify-supabase-migrations.test.sh

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Frontend unit tests
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: Playwright suite
        run: |
          npx playwright install chromium --with-deps
          npm run test:e2e

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        # See test.yml: the fuzzer's wall-clock assert is a stable-hardware
        # instrument and must never fail a release on runner variance.
        env:
          FLEURON_FUZZ_BUDGET_SECS: "3600"
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build-draft-assets:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "universal-apple-darwin"
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 50
    env:
      FLEURON_BUILD_COMMIT: ${{ github.sha }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      FLEURON_SYNC_URL: ${{ secrets.FLEURON_SYNC_URL }}
      FLEURON_SYNC_ANON_KEY: ${{ secrets.FLEURON_SYNC_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Build (${{ matrix.target }})
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            npm run tauri build -- --target universal-apple-darwin
          else
            npm run tauri build
          fi

      # ── Real packaged-app selftest — FAIL-CLOSED ──────────────────────────
      # Must pass before ANY byte is attached to the draft release.
      - name: Packaged-app selftest (real backend)
        if: matrix.target == 'universal-apple-darwin'
        shell: bash
        run: |
          bash scripts/run-selftest-with-crash-check.sh \
            --binary \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Fleuron.app/Contents/MacOS/Fleuron

      - name: Packaged-app selftest (real backend)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: node scripts/run-selftest.mjs

      - name: Windows QA runner syntax + self-check
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File qa/Test-Parse.ps1
          powershell -ExecutionPolicy Bypass -File qa/Invoke-FleuronQA.ps1 -SelfCheck

      - name: Verify macOS whole-bundle seal + DMG artifact
        if: matrix.target == 'universal-apple-darwin'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          bash scripts/verify-mac-artifact.sh \
            "src-tauri/target/universal-apple-darwin/release/bundle/dmg/Fleuron_${VERSION}_universal.dmg" \
            "$VERSION" "$FLEURON_BUILD_COMMIT"

      - name: Stage canonical artifacts (macOS)
        if: matrix.target == 'universal-apple-darwin'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          B="src-tauri/target/universal-apple-darwin/release/bundle"
          mkdir staging
          cp -f "$B/dmg/Fleuron_${VERSION}_universal.dmg" staging/
          cp -f "$B/macos/Fleuron.app.tar.gz" staging/Fleuron_universal.app.tar.gz
          cp -f "$B/macos/Fleuron.app.tar.gz.sig" staging/Fleuron_universal.app.tar.gz.sig
          find staging -type f | sort

      - name: Stage canonical artifacts (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          Copy-Item 'src-tauri/target/release/bundle/nsis/*-setup.exe' staging/
          Copy-Item 'src-tauri/target/release/bundle/nsis/*.sig' staging/
          Get-ChildItem staging | Format-Table Name,Length

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}-${{ github.sha }}
          path: staging/*
          if-no-files-found: error
          retention-days: 7

  finalize-draft:
    needs: build-draft-assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*-${{ github.sha }}
          merge-multiple: true

      - name: Assemble asset directory
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p assets
          mv "artifacts/Fleuron_${VERSION}_universal.dmg" assets/
          mv "artifacts/Fleuron_${VERSION}_x64-setup.exe" assets/
          mv "artifacts/Fleuron_${VERSION}_x64-setup.exe.sig" assets/
          mv artifacts/Fleuron_universal.app.tar.gz assets/
          mv artifacts/Fleuron_universal.app.tar.gz.sig assets/
          find assets -type f | sort
          EXPECTED=5
          COUNT=$(find assets -type f | wc -l)
          test "$COUNT" = "$EXPECTED" || { echo "expected $EXPECTED staged files before latest.json, got $COUNT"; exit 1; }

      - name: Generate updater manifest (latest.json)
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          BASE="https://github.com/wilsonhyeh/fleuron/releases/download/${TAG}"
          MAC_SIG="$(cat assets/Fleuron_universal.app.tar.gz.sig)"
          WIN_SIG="$(cat assets/Fleuron_${VERSION}_x64-setup.exe.sig)"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > assets/latest.json <<JSON
          {
            "version": "${VERSION}",
            "notes": "See https://github.com/wilsonhyeh/fleuron/blob/main/CHANGELOG.md for release notes.",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-aarch64": { "signature": "${MAC_SIG}", "url": "${BASE}/Fleuron_universal.app.tar.gz" },
              "darwin-x86_64": { "signature": "${MAC_SIG}", "url": "${BASE}/Fleuron_universal.app.tar.gz" },
              "windows-x86_64": { "signature": "${WIN_SIG}", "url": "${BASE}/Fleuron_${VERSION}_x64-setup.exe" }
            }
          }
          JSON
          node -e 'const j=require("./assets/latest.json"); if(j.version!==process.argv[1]) process.exit(1)' "$VERSION"
          echo "latest.json generated for v$VERSION"

      - name: Create DRAFT release and attach exact assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Draft-only, always: the human presses publish after re-verification.
          # Equivalent to tauri-action's `releaseDraft: true` — CI must never flip it.
          # Exact release asset inventory attached below (see docs/INSTALLING.md):
          #   Fleuron_<version>_universal.dmg
          #   Fleuron_<version>_x64-setup.exe
          #   Fleuron_<version>_x64-setup.exe.sig
          #   Fleuron_universal.app.tar.gz
          #   Fleuron_universal.app.tar.gz.sig
          #   latest.json
          gh release delete "$TAG" --yes --cleanup-tag=false 2>/dev/null || true
          # Resolve the version ONCE. Inlining $(node -p \"...\") inside a
          # double-quoted echo parses on bash 3.2 but is a syntax error on the
          # runner's bash 5 -- and even where it parsed, node received the
          # quotes literally and echoed the expression instead of the version.
          VERSION="$(node -p "require('./package.json').version")"
          {
            echo "**Publisher verification notice**"
            echo ""
            echo "> Fleuron is an independent open-source application. This build does not yet carry an Apple Developer ID/notarization or Windows Authenticode publisher signature, so your operating system cannot verify its publisher automatically. Download only from the official release page at \`https://github.com/wilsonhyeh/fleuron/releases\`. Continue only when the version, filename, and warning match this guide. A malware warning, checksum mismatch, or unexpected administrator request means stop."
            echo ""
            echo "| Your computer | Manual download |"
            echo "| --- | --- |"
            echo "| macOS (Intel or Apple Silicon) | \`Fleuron_${VERSION}_universal.dmg\` |"
            echo "| Windows 11 x64 | \`Fleuron_${VERSION}_x64-setup.exe\` |"
            echo ""
            echo "- Official source commit: ${GITHUB_SHA}"
            echo "- Install guide and expected OS warnings: docs/INSTALLING.md"
            echo "- Exact privacy disclosure: docs/PRIVACY-AND-PERMISSIONS.md"
            echo "- Support: SUPPORT.md · Security: SECURITY.md"
            echo "- Changelog: CHANGELOG.md"
            echo ""
            echo "**Updater infrastructure — do not download manually:** \`Fleuron_universal.app.tar.gz\`, \`.sig\` files, \`latest.json\`, \`SHA256SUMS.txt\`."
          } > body.md
          gh release create "$TAG" --draft --title "Fleuron $TAG" --notes-file body.md
          gh release upload "$TAG" \
            "assets/latest.json" \
            "$(echo assets/*.dmg)" \
            "$(echo assets/*-setup.exe)" \
            "$(echo assets/*-setup.exe.sig)" \
            "$(echo assets/*.app.tar.gz)" \
            "$(echo assets/*.app.tar.gz.sig)" \
            --clobber

  provenance:
    needs:
      - finalize-draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*-${{ github.sha }}
          merge-multiple: true

      - name: Staging copy for checksums
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          mkdir verify
          mv "artifacts/Fleuron_${VERSION}_universal.dmg" verify/
          mv "artifacts/Fleuron_${VERSION}_x64-setup.exe" verify/
          mv "artifacts/Fleuron_${VERSION}_x64-setup.exe.sig" verify/
          mv artifacts/Fleuron_universal.app.tar.gz verify/
          mv artifacts/Fleuron_universal.app.tar.gz.sig verify/

      # The six-asset inventory is fail-closed after both platform uploads.
      - name: Validate exact draft inventory + drafts stay drafts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          EXPECTED="Fleuron_${VERSION}_universal.dmg Fleuron_${VERSION}_x64-setup.exe Fleuron_${VERSION}_x64-setup.exe.sig Fleuron_universal.app.tar.gz Fleuron_universal.app.tar.gz.sig latest.json"
          VIEW="$(gh release view "$TAG" --repo wilsonhyeh/fleuron --json isDraft,isPrerelease,targetCommitish)"
          echo "$VIEW" | grep -q '"isDraft":true' || { echo "release must be a draft"; exit 1; }
          echo "$VIEW" | grep -q '"isPrerelease":false' || { echo "must not be a prerelease"; exit 1; }
          # NOT `gh api .../releases/tags/$TAG`: the REST "get release by tag"
          # endpoint does not resolve DRAFT releases and 404s. Every release
          # this workflow makes is a draft, so that call could never succeed.
          # `gh release view` reads drafts.
          NAMES="$(gh release view "$TAG" --repo wilsonhyeh/fleuron --json assets --jq '.assets[].name' | tr '\n' ' ')"
          for want in $EXPECTED; do
            grep -qw "$want" <<<"$NAMES" || { echo "missing asset: $want"; exit 1; }
          done
          echo "exact eight-asset inventory present on the draft"

      - name: Validate latest.json content
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          # Same reason as above: drafts are invisible to the by-tag endpoint.
          gh release view "$TAG" --repo wilsonhyeh/fleuron --json assets \
            --jq '.assets[]|select(.name=="latest.json")|.name' | grep -q latest.json
          gh release download "$TAG" --repo wilsonhyeh/fleuron --pattern 'latest.json' --dir _lj --clobber
          node -e '
            const fs=require("fs");
            const j=JSON.parse(fs.readFileSync("_lj/latest.json","utf8"));
            const v=process.argv[1];
            const tag=process.argv[2];
            if(j.version!==v) throw new Error("latest.json version "+j.version);
            const plat=["darwin-aarch64","darwin-x86_64","windows-x86_64"];
            for(const p of plat){ if(!j.platforms[p]) throw new Error("missing platform "+p); }
            for(const p of Object.values(j.platforms)){
              if(!p.url.startsWith(`https://github.com/wilsonhyeh/fleuron/releases/download/${tag}/`)) throw new Error("bad url "+p.url);
              if(typeof p.signature!=="string"||p.signature.length<40) throw new Error("bad signature");
            }
            console.log("latest.json OK");
          ' "$VERSION" "$TAG"

      - name: Generate sorted SHA256SUMS.txt for the six assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          cd verify
          for f in "Fleuron_${VERSION}_universal.dmg" \
                   "Fleuron_universal.app.tar.gz" \
                   "Fleuron_universal.app.tar.gz.sig" \
                   "Fleuron_${VERSION}_x64-setup.exe" \
                   "Fleuron_${VERSION}_x64-setup.exe.sig"; do
            test -f "$f" || { echo "missing local copy: $f"; exit 1; }
            shasum -a 256 "$f"
          done > SHA256SUMS.raw.txt
          gh release download "$TAG" --repo wilsonhyeh/fleuron --pattern 'latest.json' --dir . --clobber
          shasum -a 256 latest.json >> SHA256SUMS.raw.txt
          LC_ALL=C sort -k2 SHA256SUMS.raw.txt -o SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest the exact asset checksums
        uses: actions/attest@v4
        with:
          subject-checksums: verify/SHA256SUMS.txt

      - name: Attach SHA256SUMS.txt without replacing existing assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" verify/SHA256SUMS.txt --clobber
          STILL_DRAFT="$(gh release view "$TAG" --repo wilsonhyeh/fleuron --json isDraft --jq .isDraft)"
          test "$STILL_DRAFT" = "true" || { echo "refusing: release left draft state"; exit 1; }
          echo "✓ checksums attested + attached; release remains a DRAFT — no automation publishes it"
